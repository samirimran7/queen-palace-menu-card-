<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Mint Leaf Gradient -->
    <linearGradient id="mintGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f5127"/>
    </linearGradient>
    <!-- Secondary Mint Leaf Gradient -->
    <linearGradient id="mintGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="45%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <!-- Third Tiny Leaf Gradient -->
    <linearGradient id="mintGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="mintShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#mintShadow)">
    <!-- Leaf 2 (Background / Left angled leaf) -->
    <g transform="translate(18, 22) rotate(-22)">
      <!-- Serrated Leaf Outline -->
      <path d="M48 68 C38 60 30 52 26 44 C24 40 26 38 29 40 C26 35 29 33 33 36 C30 30 35 28 39 31 C38 25 43 23 48 26 C47 20 53 18 58 22 C59 16 66 15 70 19 C71 13 78 13 82 17 C85 22 84 28 82 34 C85 38 82 43 78 47 C79 53 74 58 70 61 C67 65 60 67 48 68 Z" fill="url(#mintGrad2)"/>
      <!-- Veins for Leaf 2 -->
      <path d="M48 68 Q58 44 82 17" stroke="#bbf7d0" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
      <path d="M52 56 Q44 52 38 54 M56 46 Q46 41 38 41 M62 38 Q52 32 46 32 M68 28 Q60 25 56 24" stroke="#bbf7d0" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
      <path d="M54 54 Q62 50 68 53 M59 44 Q68 41 74 43 M65 35 Q72 32 77 34" stroke="#bbf7d0" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
    </g>

    <!-- Fresh Mint Stem -->
    <path d="M46 98 Q54 84 58 68" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <path d="M47 97 Q54 84 57 68" stroke="#86efac" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

    <!-- Leaf 1 (Foreground / Right Main Leaf with delicate serration) -->
    <g>
      <!-- Natural Serrated Mint Leaf Margin -->
      <path d="M56 78 C52 74 46 72 44 67 C42 63 46 62 48 64 C45 59 49 57 52 60 C50 54 56 52 60 55 C59 48 65 47 70 51 C70 44 77 43 82 47 C84 41 91 42 96 46 C98 39 105 40 108 44 C110 49 108 55 104 59 C107 63 103 68 99 71 C101 76 96 80 91 82 C92 86 86 89 81 89 C78 92 71 92 68 89 C64 91 58 87 56 78 Z" fill="url(#mintGrad1)"/>
      
      <!-- Primary Central Midrib Vein -->
      <path d="M56 78 Q78 68 108 44" stroke="#bbf7d0" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 78 Q78 68 108 44" stroke="#f0fdf4" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>

      <!-- Lateral Secondary Veins -->
      <!-- Left side of midrib -->
      <path d="M64 74 Q60 66 54 66" stroke="#bbf7d0" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
      <path d="M72 70 Q66 61 62 61" stroke="#bbf7d0" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
      <path d="M81 65 Q74 55 71 56" stroke="#bbf7d0" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
      <path d="M90 59 Q84 50 82 50" stroke="#bbf7d0" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
      <path d="M99 52 Q95 46 93 46" stroke="#bbf7d0" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>

      <!-- Right side of midrib -->
      <path d="M66 73 Q72 79 78 79" stroke="#bbf7d0" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
      <path d="M76 68 Q83 74 88 73" stroke="#bbf7d0" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
      <path d="M86 63 Q93 67 97 66" stroke="#bbf7d0" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
      <path d="M95 56 Q101 59 104 57" stroke="#bbf7d0" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Small emerging top shoot leaf -->
    <path d="M58 68 C58 60 66 56 70 54 C72 58 70 65 64 68 Z" fill="url(#mintGrad3)"/>

    <!-- Glistening Dewdrops on Leaf -->
    <g>
      <!-- Dewdrop 1 -->
      <ellipse cx="80" cy="58" rx="3.5" ry="2.5" fill="#ffffff" opacity="0.85" transform="rotate(-15 80 58)"/>
      <ellipse cx="79.5" cy="57.5" rx="1.5" ry="1" fill="#ffffff"/>
      <path d="M78 59 Q80 61 82 59" stroke="#15803d" stroke-width="0.6" opacity="0.6"/>

      <!-- Dewdrop 2 -->
      <circle cx="68" cy="74" r="2" fill="#ffffff" opacity="0.8"/>
      <circle cx="67.5" cy="73.5" r="0.8" fill="#ffffff"/>
    </g>
  </g>
</svg>
