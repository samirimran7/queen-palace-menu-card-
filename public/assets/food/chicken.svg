<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crispy Golden Fried Breaded Chicken Crust Gradient -->
    <linearGradient id="crustGrad" x1="25%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="18%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Top Crispy Golden Crust Highlight -->
    <linearGradient id="crustHighlight" x1="30%" y1="10%" x2="80%" y2="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep Ambient Fried Shadow for 3D Roundness -->
    <radialGradient id="crustDepth" cx="68%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Iconic Chicken Bone Gradient -->
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Bone Shadow -->
    <linearGradient id="boneShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Overall Drop Shadow -->
    <filter id="chickenDropShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#chickenDropShadow)">
    <!-- ==================== BONE HANDLE (Iconic Double Knob) ==================== -->
    <!-- Bone Shaft -->
    <path d="M25 87 L48 64 L56 72 L33 95 Z" fill="url(#boneGrad)"/>
    <path d="M25 87 L48 64 L56 72 L33 95 Z" fill="url(#boneShadow)"/>

    <!-- Bottom-Left Double Knobs (The quintessential 🍗 bone joint) -->
    <!-- Top Knob (Upper left) -->
    <circle cx="21" cy="85" r="9" fill="url(#boneGrad)"/>
    <circle cx="21" cy="85" r="9" fill="url(#boneShadow)"/>
    
    <!-- Bottom Knob (Lower right) -->
    <circle cx="31" cy="95" r="9" fill="url(#boneGrad)"/>
    <circle cx="31" cy="95" r="9" fill="url(#boneShadow)"/>

    <!-- Smooth Bridge Between the Knobs -->
    <path d="M15 80 C 13 86 17 93 23 97 C 28 101 35 102 39 98 C 42 94 40 88 35 84 C 30 80 23 77 15 80 Z" fill="url(#boneGrad)" opacity="0.6"/>

    <!-- Crisp Bone Highlights -->
    <ellipse cx="19" cy="83" rx="4" ry="2.5" fill="#ffffff" transform="rotate(-30 19 83)"/>
    <ellipse cx="29" cy="93" rx="4" ry="2.5" fill="#ffffff" transform="rotate(-30 29 93)"/>

    <!-- ==================== CRISPY BATTER COLLAR (Where meat wraps bone) ==================== -->
    <path d="M42 66 C 40 60 47 56 52 61 C 56 57 62 61 60 67 C 62 72 57 76 52 75 C 46 76 41 71 42 66 Z" fill="#9a3412"/>
    <path d="M43 67 C 44 63 48 61 51 63 C 54 60 58 63 57 67 C 58 70 55 73 51 72 C 47 73 43 70 43 67 Z" fill="#b45309"/>

    <!-- ==================== MAIN CHICKEN DRUMSTICK MEAT BULB ==================== -->
    <!-- Plump, unmistakable pear-shaped fried drumstick silhouette -->
    <path d="M 48 68 
             C 42 56 46 38 58 26 
             C 72 12 92 14 103 27 
             C 113 40 112 60 99 75 
             C 86 89 66 89 54 80 
             C 47 75 46 72 48 68 Z" 
          fill="url(#crustGrad)"/>

    <!-- Deep Ambient 3D Shading for Plump Roundness -->
    <path d="M 48 68 
             C 42 56 46 38 58 26 
             C 72 12 92 14 103 27 
             C 113 40 112 60 99 75 
             C 86 89 66 89 54 80 
             C 47 75 46 72 48 68 Z" 
          fill="url(#crustDepth)"/>

    <!-- Golden Fried Crust Highlight (Top Curved Glow) -->
    <path d="M 58 30 
             C 70 18 88 19 98 30 
             C 105 38 105 50 98 62 
             C 92 50 82 36 67 33 
             C 62 32 59 31 58 30 Z" 
          fill="url(#crustHighlight)"/>

    <!-- Crispy Golden Batter Texture & Crunchy Breadcrumb Clusters -->
    <!-- Golden Batter Puffs -->
    <ellipse cx="74" cy="34" rx="8" ry="4.5" fill="#fde047" opacity="0.65" transform="rotate(-15 74 34)"/>
    <ellipse cx="90" cy="42" rx="7.5" ry="5" fill="#fcd34d" opacity="0.6" transform="rotate(25 90 42)"/>
    <ellipse cx="64" cy="46" rx="7" ry="4.2" fill="#fbbf24" opacity="0.5" transform="rotate(-35 64 46)"/>
    <ellipse cx="83" cy="58" rx="9" ry="5.5" fill="#b45309" opacity="0.75" transform="rotate(20 83 58)"/>
    <ellipse cx="69" cy="68" rx="8" ry="4.5" fill="#9a3412" opacity="0.7" transform="rotate(-20 69 68)"/>
    <ellipse cx="96" cy="56" rx="6.5" ry="4" fill="#b45309" opacity="0.65" transform="rotate(45 96 56)"/>

    <!-- Crisp Crunchy Breading Specks (Toasted crumbs & pepper flakes) -->
    <!-- Crisp Highlights -->
    <circle cx="68" cy="26" r="2.2" fill="#fef08a" opacity="0.85"/>
    <circle cx="82" cy="27" r="2" fill="#fef08a" opacity="0.9"/>
    <circle cx="97" cy="37" r="2.3" fill="#fef08a" opacity="0.85"/>
    <circle cx="60" cy="38" r="1.8" fill="#fef08a" opacity="0.8"/>
    <circle cx="76" cy="45" r="2.2" fill="#fef08a" opacity="0.75"/>
    <circle cx="88" cy="50" r="2" fill="#fef08a" opacity="0.8"/>
    <circle cx="60" cy="56" r="1.8" fill="#fde047" opacity="0.75"/>
    <circle cx="78" cy="71" r="1.9" fill="#fde047" opacity="0.7"/>

    <!-- Deep Toasted Batter Flecks -->
    <circle cx="62" cy="32" r="1.6" fill="#78350f"/>
    <circle cx="76" cy="24" r="1.8" fill="#451a03"/>
    <circle cx="89" cy="31" r="1.7" fill="#78350f"/>
    <circle cx="102" cy="46" r="1.8" fill="#451a03"/>
    <circle cx="71" cy="40" r="1.7" fill="#78350f"/>
    <circle cx="84" cy="46" r="1.5" fill="#451a03"/>
    <circle cx="94" cy="64" r="1.7" fill="#451a03"/>
    <circle cx="76" cy="62" r="1.8" fill="#78350f"/>
    <circle cx="62" cy="66" r="1.6" fill="#451a03"/>
    <circle cx="53" cy="50" r="1.5" fill="#78350f"/>
    <circle cx="86" cy="74" r="1.6" fill="#451a03"/>

    <!-- Golden Crest Rim Light -->
    <path d="M 54 28 C 68 14 90 15 101 28 C 109 37 109 51 103 62" 
          stroke="#fef08a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
