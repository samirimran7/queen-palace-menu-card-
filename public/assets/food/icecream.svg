<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Waffle Cone Gradient -->
    <linearGradient id="waffleConeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Strawberry Scoop Gradient -->
    <linearGradient id="strawberryScoop" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="90%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <!-- Vanilla/Cream Scoop Gradient -->
    <linearGradient id="vanillaScoop" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <!-- Chocolate Fudge Drizzle Gradient -->
    <linearGradient id="chocoFudge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#582108"/>
      <stop offset="50%" stop-color="#3d1403"/>
      <stop offset="100%" stop-color="#240c02"/>
    </linearGradient>
    <!-- Cherry Gradient -->
    <radialGradient id="cherryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="90%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <filter id="iceCreamShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#iceCreamShadow)">
    <!-- 1. Baked Waffle Cone (Triangle) -->
    <path d="M36 68 L60 114 L84 68 Z" fill="url(#waffleConeGrad)"/>

    <!-- Waffle Cone Crosshatch Grid Texture -->
    <!-- Diagonal lines Left to Right -->
    <g stroke="#78350f" stroke-width="1.2" opacity="0.65">
      <line x1="41" y1="72" x2="63" y2="108"/>
      <line x1="47" y1="72" x2="68" y2="98"/>
      <line x1="53" y1="72" x2="73" y2="88"/>
      <line x1="59" y1="72" x2="78" y2="78"/>
      <line x1="38" y1="78" x2="57" y2="108"/>
      <line x1="43" y1="88" x2="52" y2="108"/>
    </g>
    <!-- Diagonal lines Right to Left -->
    <g stroke="#78350f" stroke-width="1.2" opacity="0.65">
      <line x1="79" y1="72" x2="57" y2="108"/>
      <line x1="73" y1="72" x2="52" y2="98"/>
      <line x1="67" y1="72" x2="47" y2="88"/>
      <line x1="61" y1="72" x2="42" y2="78"/>
      <line x1="82" y1="78" x2="63" y2="108"/>
      <line x1="77" y1="88" x2="68" y2="108"/>
    </g>

    <!-- Cone Lip / Rim shadow -->
    <ellipse cx="60" cy="68" rx="24" ry="4" fill="#78350f" opacity="0.5"/>

    <!-- 2. Lower Scoop: Vanilla / Golden Custard Cream -->
    <path d="M30 64 C30 52 42 48 60 48 C78 48 90 52 90 64 C90 71 84 73 78 70 C74 74 68 73 64 70 C60 74 54 73 50 70 C44 73 38 72 34 68 C31 67 30 65 30 64 Z" fill="url(#vanillaScoop)"/>
    <!-- Cream texture creases -->
    <path d="M36 63 Q46 68 56 62" stroke="#d97706" stroke-width="1.2" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M62 63 Q72 67 84 62" stroke="#d97706" stroke-width="1.2" fill="none" opacity="0.45" stroke-linecap="round"/>

    <!-- 3. Top Scoop: Luscious Strawberry Pink -->
    <path d="M34 46 C34 26 44 20 60 20 C76 20 86 26 86 46 C86 53 82 56 76 54 C70 58 64 56 60 53 C56 57 48 56 44 53 C38 56 34 52 34 46 Z" fill="url(#strawberryScoop)"/>
    <!-- Top Scoop Cream Highlights -->
    <path d="M44 26 C50 22 62 21 68 23 C58 24 50 28 47 34 C44 32 44 28 44 26 Z" fill="#ffe4e6" opacity="0.6"/>
    <!-- Soft swirl ripple on scoop -->
    <path d="M42 40 Q54 46 68 38 Q74 44 80 42" stroke="#f43f5e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- 4. Glossy Chocolate Fudge Drizzle Cascading Down -->
    <path d="M46 25 C52 26 56 30 58 35 C60 42 58 48 57 52 C56 55 58 58 61 58 C63 58 64 55 64 50 C64 42 66 36 70 32 C74 28 78 28 80 32 C82 36 82 42 81 48 C81 53 84 55 86 52 C87 48 88 40 86 34 C85 28 80 24 74 23 C68 22 60 21 54 22 C48 23 46 25 46 25 Z" fill="url(#chocoFudge)"/>
    <!-- Fudge specular shine -->
    <path d="M52 25 Q58 27 60 34" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M72 26 Q76 28 77 34" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.45" stroke-linecap="round"/>

    <!-- Colorful Sprinkle Details on Ice Cream -->
    <rect x="42" y="34" width="4.5" height="1.8" rx="0.9" fill="#facc15" transform="rotate(35 42 34)"/>
    <rect x="52" y="44" width="4.5" height="1.8" rx="0.9" fill="#38bdf8" transform="rotate(-25 52 44)"/>
    <rect x="74" y="42" width="4.5" height="1.8" rx="0.9" fill="#4ade80" transform="rotate(50 74 42)"/>
    <rect x="66" y="48" width="4" height="1.8" rx="0.9" fill="#f43f5e" transform="rotate(-15 66 48)"/>

    <!-- 5. Maraschino Cherry on Top with Stem -->
    <g>
      <!-- Cherry Stem -->
      <path d="M60 16 C60 8 72 2 78 2" stroke="#582108" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- Cherry Body -->
      <circle cx="60" cy="18" r="7.5" fill="url(#cherryGrad)"/>
      <!-- Specular Highlight on Cherry -->
      <ellipse cx="58" cy="15.5" rx="2.5" ry="1.4" fill="#ffffff" opacity="0.85" transform="rotate(-25 58 15.5)"/>
    </g>
  </g>
</svg>
