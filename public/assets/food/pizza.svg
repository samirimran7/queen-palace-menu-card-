<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crust Gradient -->
    <linearGradient id="pizzaCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <!-- Melted Cheese Gradient -->
    <linearGradient id="pizzaCheese" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <!-- Marinara Sauce Gradient -->
    <linearGradient id="pizzaSauce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <!-- Pepperoni Gradient -->
    <radialGradient id="pepperoniGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="65%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <!-- Mushroom Gradient -->
    <linearGradient id="mushroomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="60%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <filter id="pizzaShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#pizzaShadow)">
    <!-- Base Pizza Crust Shape (Triangle Slice with Puffy Top Arc) -->
    <!-- Baked Golden Crust Rim (Top Arch) -->
    <path d="M18 24 Q60 10 102 24 C106 31 103 36 96 36 Q60 25 24 36 C17 36 14 31 18 24 Z" fill="url(#pizzaCrust)"/>
    <!-- Crust baked blistering bubbles -->
    <ellipse cx="38" cy="22" rx="4" ry="2.2" fill="#78350f" opacity="0.6"/>
    <ellipse cx="62" cy="18" rx="5" ry="2.5" fill="#78350f" opacity="0.7"/>
    <ellipse cx="84" cy="22" rx="3.5" ry="2" fill="#78350f" opacity="0.6"/>
    <ellipse cx="50" cy="20" rx="2" ry="1.2" fill="#451a03" opacity="0.8"/>
    <ellipse cx="72" cy="19" rx="2.5" ry="1.5" fill="#451a03" opacity="0.8"/>

    <!-- Marinara Sauce Underlayer Peeking Out -->
    <path d="M22 34 Q60 23 98 34 L62 106 Q60 109 58 106 Z" fill="url(#pizzaSauce)"/>

    <!-- Melted Mozzarella & Cheddar Cheese Surface with melted drip tip -->
    <path d="M24 35 Q60 25 96 35 L61 104 C60 107 58 105 57 102 L24 35 Z" fill="url(#pizzaCheese)"/>
    <!-- Cheese Browning / Bubbling patches -->
    <ellipse cx="44" cy="46" rx="6" ry="3.5" fill="#ca8a04" opacity="0.5" transform="rotate(-15 44 46)"/>
    <ellipse cx="72" cy="44" rx="7" ry="4" fill="#ca8a04" opacity="0.45" transform="rotate(20 72 44)"/>
    <ellipse cx="58" cy="74" rx="5" ry="3" fill="#ca8a04" opacity="0.5" transform="rotate(10 58 74)"/>

    <!-- Pepperoni 1 (Top Left) -->
    <g>
      <circle cx="44" cy="45" r="10.5" fill="url(#pepperoniGrad)"/>
      <circle cx="44" cy="45" r="9.5" stroke="#7f1d1d" stroke-width="0.8" fill="none" opacity="0.6"/>
      <!-- Seasoning speckles -->
      <circle cx="41" cy="42" r="0.8" fill="#450a0a"/>
      <circle cx="46" cy="41" r="0.7" fill="#fef08a" opacity="0.7"/>
      <circle cx="48" cy="47" r="0.8" fill="#450a0a"/>
      <circle cx="42" cy="48" r="0.7" fill="#450a0a"/>
      <!-- Sizzle sheen -->
      <path d="M38 41 Q42 38 47 40" stroke="#fca5a5" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
    </g>

    <!-- Pepperoni 2 (Top Right) -->
    <g>
      <circle cx="75" cy="50" r="11" fill="url(#pepperoniGrad)"/>
      <circle cx="75" cy="50" r="10" stroke="#7f1d1d" stroke-width="0.8" fill="none" opacity="0.6"/>
      <circle cx="72" cy="47" r="0.8" fill="#450a0a"/>
      <circle cx="78" cy="46" r="0.8" fill="#fef08a" opacity="0.7"/>
      <circle cx="77" cy="53" r="0.7" fill="#450a0a"/>
      <circle cx="71" cy="52" r="0.8" fill="#450a0a"/>
      <path d="M70 46 Q74 43 79 45" stroke="#fca5a5" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
    </g>

    <!-- Pepperoni 3 (Center Lower) -->
    <g>
      <circle cx="58" cy="74" r="10" fill="url(#pepperoniGrad)"/>
      <circle cx="58" cy="74" r="9" stroke="#7f1d1d" stroke-width="0.8" fill="none" opacity="0.6"/>
      <circle cx="55" cy="71" r="0.7" fill="#450a0a"/>
      <circle cx="61" cy="71" r="0.8" fill="#fef08a" opacity="0.7"/>
      <circle cx="59" cy="77" r="0.7" fill="#450a0a"/>
      <circle cx="54" cy="76" r="0.8" fill="#450a0a"/>
      <path d="M53 71 Q57 68 62 70" stroke="#fca5a5" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
    </g>

    <!-- Sautéed Mushroom Slices -->
    <!-- Mushroom 1 -->
    <g transform="translate(54, 34) rotate(15) scale(0.7)">
      <path d="M6 10 C6 4 14 0 20 0 C26 0 34 4 34 10 C34 14 28 15 26 15 L24 22 C24 23 22 24 20 24 C18 24 16 23 16 22 L14 15 C12 15 6 14 6 10 Z" fill="url(#mushroomGrad)"/>
      <path d="M12 11 Q20 8 28 11" stroke="#57534e" stroke-width="1" fill="none" opacity="0.5"/>
    </g>
    <!-- Mushroom 2 -->
    <g transform="translate(32, 64) rotate(-30) scale(0.65)">
      <path d="M6 10 C6 4 14 0 20 0 C26 0 34 4 34 10 C34 14 28 15 26 15 L24 22 C24 23 22 24 20 24 C18 24 16 23 16 22 L14 15 C12 15 6 14 6 10 Z" fill="url(#mushroomGrad)"/>
    </g>

    <!-- Fresh Green Basil Leaves -->
    <path d="M56 56 C53 50 60 48 64 50 C67 52 66 58 62 60 C58 60 56 58 56 56 Z" fill="#22c55e"/>
    <path d="M58 56 Q61 52 63 51" stroke="#86efac" stroke-width="0.8" fill="none"/>

    <path d="M42 82 C39 78 44 75 48 77 C50 79 49 84 46 85 C43 85 41 84 42 82 Z" fill="#16a34a"/>
    <path d="M43 82 Q45 79 47 78" stroke="#86efac" stroke-width="0.7" fill="none"/>

    <path d="M72 68 C70 64 76 62 79 64 C82 66 80 71 77 72 C74 72 72 70 72 68 Z" fill="#22c55e"/>

    <!-- Melted Cheese Pull at Pointy Tip -->
    <path d="M57 102 Q59 110 60 114 Q61 110 62 104" fill="#fde047" stroke="#eab308" stroke-width="0.8"/>
  </g>
</svg>
